name: release
on:
  push:
    tags: ['v*']
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-13
            asset: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build --release --locked
      - run: mv target/release/relay relay-${{ matrix.asset }}
      - run: shasum -a 256 relay-${{ matrix.asset }} > relay-${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.asset }}
          path: |
            relay-${{ matrix.asset }}
            relay-${{ matrix.asset }}.sha256
