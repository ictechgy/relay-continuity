name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-13
            asset: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: mv target/release/relay relay-${{ matrix.asset }}
      - run: shasum -a 256 relay-${{ matrix.asset }} > relay-${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-${{ matrix.asset }}
          path: |
            relay-${{ matrix.asset }}
            relay-${{ matrix.asset }}.sha256
