name: release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  archive:
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: macos-15
            asset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: mv target/release/relay relay-${{ matrix.asset }}
      - run: shasum -a 256 relay-${{ matrix.asset }} > relay-${{ matrix.asset }}.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: relay-${{ matrix.asset }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-${{ matrix.asset }}
          path: |
            relay-${{ matrix.asset }}
            relay-${{ matrix.asset }}.sha256
  npm-packages:
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: relay-*
          path: release-assets
          merge-multiple: true
          # Preserve v8 digest enforcement while bypassing its deprecated unzip-stream path.
          skip-decompress: true
          digest-mismatch: error
      - name: Extract verified native artifact archives
        run: |
          expected_archives="$(printf '%s\n' \
            "relay-linux-x86_64.zip" \
            "relay-macos-arm64.zip" \
            "relay-macos-x86_64.zip" | LC_ALL=C sort)"
          actual_archives="$(find release-assets -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)"
          test "$actual_archives" = "$expected_archives"
          for asset in linux-x86_64 macos-x86_64 macos-arm64; do
            archive="release-assets/relay-$asset.zip"
            test -f "$archive"
            test ! -L "$archive"
            expected="$(printf 'relay-%s\nrelay-%s.sha256\n' "$asset" "$asset" | LC_ALL=C sort)"
            actual="$(unzip -Z1 "$archive" | LC_ALL=C sort)"
            test "$actual" = "$expected"
            unzip -q "$archive" -d release-assets
            for entry in "relay-$asset" "relay-$asset.sha256"; do
              test -f "release-assets/$entry"
              test ! -L "release-assets/$entry"
            done
            rm -- "$archive"
          done
      - name: Verify native build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          for asset in linux-x86_64 macos-x86_64 macos-arm64; do
            gh attestation verify "release-assets/relay-$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Package npm distribution
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          node scripts/package-npm.mjs --artifacts release-assets --output dist/npm --version "$version"
          node scripts/verify-npm-packages.mjs \
            --output dist/npm \
            --artifacts release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: |
            dist/npm/tarballs
            dist/npm/publish-order.txt
            dist/npm/publish-manifest.json
  npm-publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.PUBLISH_NPM == 'true'
    needs: npm-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: npm-packages
          # Preserve v8 digest enforcement while bypassing its deprecated unzip-stream path.
          skip-decompress: true
          digest-mismatch: error
      - name: Extract verified npm artifact archive
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          archive="npm-packages/npm-packages.zip"
          actual_archives="$(find npm-packages -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)"
          test "$actual_archives" = "npm-packages.zip"
          test -f "$archive"
          test ! -L "$archive"
          expected="$(printf '%s\n' \
            "publish-manifest.json" \
            "publish-order.txt" \
            "tarballs/ictechgy-relay-$version.tgz" \
            "tarballs/ictechgy-relay-darwin-arm64-$version.tgz" \
            "tarballs/ictechgy-relay-darwin-x64-$version.tgz" \
            "tarballs/ictechgy-relay-linux-x64-$version.tgz" | LC_ALL=C sort)"
          actual="$(unzip -Z1 "$archive" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          unzip -q "$archive" -d npm-packages
          printf '%s\n' "$actual" | while IFS= read -r entry; do
            test -f "npm-packages/$entry"
            test ! -L "npm-packages/$entry"
          done
          rm -- "$archive"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm staging toolchain
        run: |
          npm install --global npm@11.15.0 --ignore-scripts
          node --version
          npm --version
          node --input-type=module -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error("Node 22.14.0 or later is required");'
          node --input-type=module -e 'const [major, minor] = (await import("node:child_process")).execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number); if (major < 11 || (major === 11 && minor < 15)) throw new Error("npm 11.15.0 or later is required");'
      - name: Stage platform packages before the wrapper
        run: |
          node scripts/stage-npm-packages.mjs \
            --tarballs npm-packages/tarballs \
            --order npm-packages/publish-order.txt \
            --manifest npm-packages/publish-manifest.json \
            --output npm-stage-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: npm-stage-manifest
          path: npm-stage-manifest.json
          if-no-files-found: warn
