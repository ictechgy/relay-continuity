name: Feature request
description: Suggest a privacy-preserving improvement to Relay.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Relay is local-first. Do **not** include source code, diffs, paths, logs, chats, tokens, credentials, customer data, or private workflow details. Potential vulnerabilities belong in private security reporting.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the general workflow problem without identifying a private repository or person.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired Relay behavior and privacy expectations.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed sensitive work artifacts and understand that public issues are not for security reports.
          required: true
